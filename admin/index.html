<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Portfolio Admin</title><meta name="robots" content="noindex,nofollow"><style>body{margin:0;background:#111;color:#eee;font:15px system-ui;min-height:100vh}.shell{max-width:1100px;margin:auto;padding:40px 22px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:30px}.brand{font:12px monospace;letter-spacing:.12em;text-transform:uppercase}.panel{border:1px solid #303030;border-radius:18px;background:#181818;padding:24px;margin-bottom:16px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}button,input,textarea{font:inherit}button{border:1px solid #444;background:#222;color:#fff;border-radius:10px;padding:10px 13px;cursor:pointer}button:hover{background:#333}.primary{background:#dfff61;color:#111;border-color:#dfff61}.danger{background:#3a1717}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}label{display:block;color:#999;font-size:12px;margin-bottom:6px}input,textarea{width:100%;box-sizing:border-box;background:#101010;border:1px solid #333;color:#fff;border-radius:9px;padding:11px}textarea{min-height:120px;resize:vertical}.hidden{display:none}.status{padding:10px;border-radius:9px;background:#202020;color:#aaa;margin-top:12px}.row{display:flex;gap:8px;justify-content:flex-end}@media(max-width:700px){.grid{grid-template-columns:1fr}.top{align-items:flex-start;gap:15px;flex-direction:column}}</style></head><body><div class="shell"><div class="top"><div class="brand">SEV / Portfolio Admin</div><button id="logout" class="hidden">Log out</button></div><section id="login" class="panel"><h1>Admin access</h1><p style="color:#999">Sign in with the Supabase admin account configured for this portfolio.</p><div class="grid"><div><label>Email</label><input id="email" type="email" autocomplete="username"></div><div><label>Password</label><input id="password" type="password" autocomplete="current-password"></div></div><div class="row" style="margin-top:14px"><button id="loginBtn" class="primary">Sign in</button></div><div id="loginStatus" class="status"></div></section><section id="app" class="hidden"><div class="tabs"><button data-table="profile">Intro</button><button data-table="internships">Internships</button><button data-table="skills">Skills</button><button data-table="projects">Projects</button><button data-table="certificates">Certificates</button><button data-table="contact">Contact</button></div><div class="panel"><h2 id="title">Portfolio data</h2><p style="color:#999">Edit the selected record. Changes are saved to Supabase.</p><textarea id="editor"></textarea><div class="row" style="margin-top:12px"><button id="save" class="primary">Save JSON</button></div><div id="status" class="status"></div></div></section></div><script type="module">/* Supabase wiring is intentionally loaded from config.js, which is not committed with secrets. The public anon key is safe only when database RLS is correctly configured. */
const cfg=window.__SUPABASE_CONFIG__;const $=id=>document.getElementById(id);let current='profile';let session=null;
function showApp(){ $('login').classList.add('hidden');$('app').classList.remove('hidden');$('logout').classList.remove('hidden'); }
async function load(){ if(!cfg?.url||!cfg?.anonKey){$('loginStatus').textContent='Supabase is not configured yet. Add admin/config.js with your project URL and anon key.';return;} const {createClient}=await import('https://esm.sh/@supabase/supabase-js@2');window.sb=createClient(cfg.url,cfg.anonKey);const {data}=await sb.auth.getSession();session=data.session;if(session)showApp(); }
$('loginBtn').onclick=async()=>{if(!window.sb){$('loginStatus').textContent='Configure Supabase first.';return;}const {error}=await sb.auth.signInWithPassword({email:$('email').value,password:$('password').value});$('loginStatus').textContent=error?error.message:'Signed in.';if(!error){session=(await sb.auth.getSession()).data.session;showApp();}};
$('logout').onclick=async()=>{await sb?.auth.signOut();location.reload()};document.querySelectorAll('[data-table]').forEach(b=>b.onclick=async()=>{current=b.dataset.table;$('title').textContent=current; if(!window.sb)return;const {data,error}=await sb.from(current).select('*').limit(50);$('editor').value=JSON.stringify(data||[],null,2);$('status').textContent=error?error.message:'Loaded.'});$('save').onclick=async()=>{try{const value=JSON.parse($('editor').value);if(!Array.isArray(value))throw Error('Expected a JSON array.');const {error:delError}=await sb.from(current).delete().neq('id','00000000-0000-0000-0000-000000000000');if(delError)throw delError;const {error}=value.length?await sb.from(current).insert(value):{error:null};$('status').textContent=error?error.message:'Saved.'}catch(e){$('status').textContent=e.message}};load();</script><script src="./config.js"></script></body></html>
